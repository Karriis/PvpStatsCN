name: 发布库链版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建或更新的 Release 标签"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 下载 Dalamud 开发运行库
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest-dalamud.zip
          Expand-Archive -Force latest-dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: 构建 Release 插件包
        run: dotnet build PvpStats.sln --configuration Release

      - name: 校验版本更新日志
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath './PvpStats/bin/x64/Release/PvpStatsCN/PvpStatsCN.json' -Raw | ConvertFrom-Json
          $published = (Get-Content -LiteralPath './pluginmaster.json' -Raw | ConvertFrom-Json)[0]

          if(
            $manifest.AssemblyVersion -ne $published.AssemblyVersion -and
            $manifest.Changelog.Trim() -eq $published.Changelog.Trim()
          ) {
            throw "插件版本已从 $($published.AssemblyVersion) 更新到 $($manifest.AssemblyVersion)，但 Changelog 未更新。"
          }

      - name: 生成插件仓库清单
        shell: pwsh
        run: |
          ./scripts/New-PluginMaster.ps1 `
            -ManifestPath ./PvpStats/bin/x64/Release/PvpStatsCN/PvpStatsCN.json `
            -OutputPath ./pluginmaster.json `
            -Repository $env:GITHUB_REPOSITORY

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(
            './PvpStats/bin/x64/Release/PvpStatsCN/latest.zip',
            './pluginmaster.json'
          )

          gh release view $tag *> $null
          if($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }

      - name: 同步固定库链清单到主分支
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/contents/pluginmaster.json?ref=main" --jq '.sha'
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path './pluginmaster.json')))
          $payload = @{
            message = "更新库链清单至 $env:RELEASE_TAG"
            content = $content
            sha = $sha
            branch = 'main'
          } | ConvertTo-Json

          $payload | gh api "repos/$env:GITHUB_REPOSITORY/contents/pluginmaster.json" --method PUT --input -
